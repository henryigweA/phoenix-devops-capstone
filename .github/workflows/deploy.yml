name: Build and Deploy Phoenix API

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Log in to ACR
        run: az acr login --name acrphoenixdev001

      - name: Build and push image
        run: |
          docker build -t acrphoenixdev001.azurecr.io/phoenix-api:${{ github.sha }} .
          docker push acrphoenixdev001.azurecr.io/phoenix-api:${{ github.sha }}

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group rg-phoenix-dev --name aks-phoenix-dev --overwrite-existing

      - name: Deploy to AKS
        run: |
          kubectl set image deployment/phoenix-api phoenix-api=acrphoenixdev001.azurecr.io/phoenix-api:${{ github.sha }}
          kubectl apply -f k8s/service.yaml